# Local development only. `docker compose up` (or `make dev`) serves the app on
# http://localhost:3000; set APP_PORT to use another port. Node runs in the
# container and node_modules lives in the project folder, so the editor sees it.
name: sledger

services:
  app:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    command: sh -c "[ -d node_modules ] || npm ci; exec npm run dev -- --hostname 0.0.0.0"
